<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Milkarf - Estamos actualizando nuestra web para ofrecerte una mejor experiencia.">
    <title>Milkarf · Mantenimiento</title>

    <!-- Google Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuración exacta de Milkarf -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        purple: { DEFAULT: '#421d8e', dark: '#2e1060', light: '#faf8ff', border: '#e8e0f0' },
                        green: { DEFAULT: '#b9cb25', dark: '#829112', light: '#f7fae6' },
                        pink: { DEFAULT: '#d72b8f', dark: '#b31c71', light: '#fff0f5' },
                        cream: '#f5f0e8',
                        midnight: '#13052A' 
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            /* Fondo crema original */
            background-color: #f5f0e8;
            overflow-x: hidden; /* Permite scroll vertical, bloquea el horizontal */
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh; /* Permite que el fondo crezca si el contenido es más alto */
            color: #13052A;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Efecto de resplandor sutil detrás de la imagen */
        .glow-effect {
            position: absolute;
            inset: -5px;
            background: linear-gradient(45deg, #b9cb25, #d72b8f, #421d8e);
            border-radius: 50%;
            filter: blur(15px);
            opacity: 0.4;
            animation: pulse-glow 4s ease-in-out infinite alternate;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.3; transform: scale(0.95); }
            100% { opacity: 0.6; transform: scale(1.05); }
        }

        /* Botones de contacto */
        .paw-contact-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 18px;
            border-radius: 20px;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease, filter 0.25s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.15);
            will-change: transform, filter;
            transform: translateZ(0);
        }
        @media (min-width: 640px) {
            .paw-contact-btn {
                padding: 16px 20px; /* Un poco más grande en pantallas que no son móviles */
            }
        }
        .paw-contact-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
            pointer-events: none;
        }
        .paw-contact-btn:hover {
            transform: translateY(-4px) scale(1.02) translateZ(0);
            filter: brightness(1.1);
            box-shadow: 0 15px 30px -10px rgba(0,0,0,0.3);
        }
        .paw-contact-btn:hover .paw-icon-wrap { transform: rotate(-12deg) scale(1.1) translateZ(0); }
        .paw-contact-btn:active { transform: scale(0.97) translateZ(0); transition-duration: 0.1s; }

        .paw-icon-wrap {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
            position: relative;
            z-index: 1;
            will-change: transform;
        }
        @media (min-width: 640px) {
            .paw-icon-wrap {
                width: 48px;
                height: 48px;
            }
        }
        .paw-text-col { display: flex; flex-direction: column; gap: 2px; position: relative; z-index: 1; text-align: left; }
        .paw-deco { position: absolute; opacity: 0.1; pointer-events: none; }
        .paw-label { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 15px; letter-spacing: -0.3px; color: #fff; line-height: 1; }
        @media (min-width: 640px) { .paw-label { font-size: 16px; } }
        .paw-sub { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 11px; color: rgba(255,255,255,0.9); }
        .arrow-icon { margin-left: auto; opacity: 0.6; position: relative; z-index: 1; transition: transform 0.25s ease, opacity 0.25s ease; will-change: transform, opacity;}
        .paw-contact-btn:hover .arrow-icon { transform: translateX(4px) translateZ(0); opacity: 1; }

        .spin-slow { animation: spin 6s linear infinite; transform-origin: center center; will-change: transform; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        #paws-container { transform: translateZ(0); pointer-events: none; }
    </style>
</head>

<body class="antialiased font-sans flex items-center justify-center relative min-h-screen py-10 px-4 sm:px-6">

    <!-- Huellitas decorativas en el fondo ('fixed' para no afectar el scroll) -->
    <div id="paws-container" class="fixed inset-0 z-0 overflow-hidden"></div>

    <!-- Contenedor Principal (Sin tarjeta, fluyendo directo en el fondo) -->
    <main class="w-full max-w-[440px] p-4 sm:p-6 md:p-8 relative z-10 text-center flex flex-col items-center my-auto">
        
        <!-- Logo -->
        <div class="flex flex-col items-center mb-5 sm:mb-6 select-none">
            <h1 class="text-4xl sm:text-5xl font-black tracking-tight text-purple-dark drop-shadow-sm">Milkarf</h1>
        </div>

        <!-- Imagen Temática (Circular con borde degradado) -->
        <div class="relative w-32 h-32 sm:w-36 sm:h-36 md:w-40 md:h-40 rounded-full mb-7 sm:mb-8 mt-2">
            <!-- Capa de resplandor -->
            <div class="glow-effect"></div>
            <!-- Borde degradado -->
            <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-green via-pink to-purple p-1 z-10">
                <!-- Imagen del perrito atento -->
                <img src="https://images.unsplash.com/photo-1510771463146-e89e6e86560e?q=80&w=600&auto=format&fit=crop" 
                     alt="Perrito atento" 
                     class="w-full h-full object-cover rounded-full border-4 border-white"
                     loading="eager"
                     decoding="async">
            </div>
        </div>

        <!-- Etiqueta de Estado Flotante -->
        <div class="bg-pink-light border border-pink/30 text-pink-dark backdrop-blur-md text-[10px] sm:text-xs font-black px-4 py-2 sm:px-5 sm:py-2.5 rounded-full uppercase tracking-widest flex items-center gap-2 mb-5 sm:mb-6 shadow-md transform -translate-y-12 sm:-translate-y-12 z-20">
            <i data-lucide="settings" class="w-3.5 h-3.5 sm:w-4 sm:h-4 spin-slow text-pink-dark"></i>
            Mejorando la receta
        </div>

        <!-- Textos Adaptables -->
        <div class="-mt-4">
            <h2 class="text-xl sm:text-2xl md:text-3xl font-black text-purple-dark mb-2 sm:mb-3 leading-tight drop-shadow-sm">
                Estamos preparando<br><span class="text-purple">algo increíble</span>
            </h2>
            <p class="text-xs sm:text-sm font-medium text-gray-600 leading-relaxed mb-6 sm:mb-8 px-1 sm:px-2">
                Nuestra cocina digital está recibiendo una dosis extra de innovación. Estaremos de vuelta muy pronto con una experiencia renovada.
            </p>
        </div>

        <!-- Separador sutil -->
        <div class="w-full h-px bg-gradient-to-r from-transparent via-purple-border to-transparent mb-5 sm:mb-6"></div>

        <p class="text-[9px] sm:text-[10px] font-black text-purple/50 uppercase tracking-[0.2em] mb-4">
            ¡Seguimos tomando pedidos!
        </p>

        <!-- Botones de Contacto -->
        <div class="w-full space-y-3">
            <!-- WhatsApp Oficial -->
            <a href="https://wa.link/pwe23z" target="_blank" rel="noopener noreferrer"
                class="paw-contact-btn shadow-lg"
                style="background: linear-gradient(135deg, #075e54 0%, #128C7E 50%, #25D366 100%);">
                <i data-lucide="paw-print" class="paw-deco w-28 h-28" style="bottom:-10px;right:-10px;color:white;" aria-hidden="true"></i>
                <div class="paw-icon-wrap">
                    <!-- Icono SVG oficial de WhatsApp -->
                    <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.305-.885-.653-1.482-1.46-1.656-1.758-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51h-.57c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
                    </svg>
                </div>
                <div class="paw-text-col">
                    <span class="paw-label">WhatsApp</span>
                    <span class="paw-sub">Escríbenos aquí</span>
                </div>
                <i data-lucide="chevron-right" class="arrow-icon w-5 h-5 text-white"></i>
            </a>

            <!-- Instagram Oficial -->
            <a href="https://www.instagram.com/milkarfood?igsh=MW1iaTFuZHg3dXowdQ%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer"
                class="paw-contact-btn shadow-lg"
                style="background: linear-gradient(135deg, #2e1060 0%, #421d8e 55%, #d72b8f 100%);">
                <i data-lucide="paw-print" class="paw-deco w-28 h-28" style="bottom:-10px;right:-10px;color:white;" aria-hidden="true"></i>
                <div class="paw-icon-wrap">
                    <!-- Icono SVG oficial de Instagram -->
                    <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.07M12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
                    </svg>
                </div>
                <div class="paw-text-col">
                    <span class="paw-label">Instagram</span>
                    <span class="paw-sub">@milkarfood</span>
                </div>
                <i data-lucide="chevron-right" class="arrow-icon w-5 h-5 text-white"></i>
            </a>
        </div>

    </main>

    <!-- Iconos de Lucide (Solo para las flechas y la tuerquita de mantenimiento) -->
    <script src="https://unpkg.com/lucide@latest" defer></script>

    <!-- Scripts de interactividad y rendimiento -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            // Retrasar sutilmente la carga de partículas para mejorar el primer renderizado
            setTimeout(initFloatingPaws, 50);
        });

        // Generador de Huellitas Flotantes
        const PAW_SVG_TPL = function(color) {
            return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="' + color + '">'
                + '<path d="M50 88 C33 88 18 76 18 62 C18 50 32 42 50 42 C68 42 82 50 82 62 C82 76 67 88 50 88Z"/>'
                + '<ellipse cx="23" cy="35" rx="10.5" ry="13.5" transform="rotate(-28,23,35)"/>'
                + '<ellipse cx="38" cy="24" rx="10.5" ry="13.5" transform="rotate(-10,38,24)"/>'
                + '<ellipse cx="58" cy="24" rx="10.5" ry="13.5" transform="rotate(10,58,24)"/>'
                + '<ellipse cx="75" cy="35" rx="10.5" ry="13.5" transform="rotate(28,75,35)"/>'
                + '</svg>';
        };

        function initFloatingPaws() {
            var container = document.getElementById('paws-container');
            container.innerHTML = '';
            var oldStyle = document.getElementById('paw-maint-keyframes');
            if(oldStyle) oldStyle.remove();

            // Colores oscuros/marca para que contrasten sobre fondo crema
            var COLORS   = ['#421d8e', '#b9cb25', '#d72b8f', '#2e1060', '#829112'];
            var COUNT    = window.innerWidth < 640 ? 10 : 15; // Menos partículas en móviles para asegurar 60FPS
            var W        = window.innerWidth;
            var H        = window.innerHeight;
            
            var fragment = document.createDocumentFragment();
            var cssRules = [];

            for (var i = 0; i < COUNT; i++) {
                var startX  = Math.random() * W;
                var startY  = Math.random() * H;
                var size    = Math.round(30 * (0.5 + Math.random())); 
                var angle   = Math.random() * Math.PI * 2;
                var dist    = 150 + Math.random() * 250;
                var endDX   = Math.cos(angle) * dist;
                var endDY   = Math.sin(angle) * dist;
                
                var midDX   = endDX * 0.5 + (Math.random() - 0.5) * 80;
                var midDY   = endDY * 0.5 + (Math.random() - 0.5) * 80;
                var rot     = (Math.random() > 0.5 ? 1 : -1) * (140 + Math.random() * 180);
                
                // Opacidad muy tenue para fondo claro
                var opacity = (0.04 + Math.random() * 0.08).toFixed(3);
                var dur     = (12 + Math.random() * 15).toFixed(1); 
                var delay   = -(Math.random() * parseFloat(dur));
                var color   = COLORS[i % COLORS.length];
                var name    = 'pawMaint' + i;

                cssRules.push(
                    '@keyframes ' + name + ' {'
                    + '0%   { transform:translate3d(0,0,0) rotate(0deg); opacity:0; }'
                    + '10%  { opacity:' + opacity + '; }'
                    + '50%  { transform:translate3d(' + midDX.toFixed(1) + 'px,' + midDY.toFixed(1) + 'px, 0) rotate(' + (rot * 0.5).toFixed(0) + 'deg); opacity:' + opacity + '; }'
                    + '90%  { opacity:' + (opacity * 0.5).toFixed(3) + '; }'
                    + '100% { transform:translate3d(' + endDX.toFixed(1) + 'px,' + endDY.toFixed(1) + 'px, 0) rotate(' + rot.toFixed(0) + 'deg); opacity:0; }'
                    + '}'
                );

                var el = document.createElement('div');
                el.className = 'absolute pointer-events-none';
                el.setAttribute('aria-hidden', 'true');
                el.innerHTML = PAW_SVG_TPL(color);
                
                el.style.left          = startX + 'px';
                el.style.top           = startY + 'px';
                el.style.width         = size + 'px';
                el.style.height        = size + 'px';
                el.style.willChange    = 'transform, opacity'; 
                el.style.animation     = name + ' ' + dur + 's linear ' + delay.toFixed(2) + 's infinite';
                
                fragment.appendChild(el);
            }

            container.appendChild(fragment);

            var styleEl      = document.createElement('style');
            styleEl.id       = 'paw-maint-keyframes';
            styleEl.textContent = cssRules.join('\n');
            document.head.appendChild(styleEl);
        }

        // Manejador pasivo para el redimensionamiento, optimizado
        let resizeTimer;
        window.addEventListener('resize', () => {
            if (resizeTimer) cancelAnimationFrame(resizeTimer);
            resizeTimer = requestAnimationFrame(() => {
                if(Math.abs(window.innerWidth - parseInt(document.getElementById('paws-container').dataset.w || 0)) > 50) {
                     document.getElementById('paws-container').dataset.w = window.innerWidth;
                     initFloatingPaws();
                }
            });
        }, { passive: true });
    </script>
</body>
</html>
